aid: galileo
name: Galileo
description: >-
  Galileo (galileo.io, formerly reached at galileohealth.com) is a value-based,
  digitally enabled healthcare delivery company founded by Tom X. Lee (previously
  Epocrates and One Medical). It delivers 24/7 primary and multi-specialty care
  through a mobile app, in-home visits, mobile clinics, and virtual care, combining
  a proprietary clinical technology platform, a recruited network of primary-care
  and specialist clinicians, and hospitality-style member support. Galileo operates
  a fully bilingual (English/Spanish) platform and serves individuals and families,
  employers, small businesses, and health plans through membership and population-
  health partnerships. It is a care-delivery business, not an API platform: as of
  this profile Galileo publishes no public developer API, SDKs, or developer portal.
